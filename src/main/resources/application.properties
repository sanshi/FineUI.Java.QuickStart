server.port=8081

# 首页路由：GET / 重定向到 /index（对应 @FineUIPage("index") 的框架页首页）
fineui.home=index

# ===== 数据库：H2 文件模式（零安装、数据存本地 ./data 文件、重启不丢） =====
# AUTO_SERVER=TRUE：允许 H2 Console 等第二个连接同时连入同一个文件库
spring.datasource.url=jdbc:h2:file:./data/moviedb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Web 控制台：浏览器访问 http://localhost:8081/h2-console 查看/编辑数据
spring.h2.console.enabled=true

# ===== JPA / Hibernate：实体注解即表结构（Code First） =====
# update：库/表不存在则按实体建，已存在只增量改，不删已有数据
spring.jpa.hibernate.ddl-auto=update
# data.sql 在 Hibernate 建表之后执行（否则表还没建好，种子插入失败）
spring.jpa.defer-datasource-initialization=true
# 总是执行 data.sql：连接串带 AUTO_SERVER=TRUE 会让 Spring 把 H2 判为“非嵌入式”，
# 默认的 mode=embedded 会跳过 data.sql；用 always 确保种子脚本执行（脚本自身幂等，重复启动安全）
spring.sql.init.mode=always
# 开发期打印 SQL，便于观察
spring.jpa.show-sql=true

# ===== FineUI 全局配置（fineui.* → 全站默认） =====
# 全局主题（切换 themes/{theme}/theme.css）
fineui.theme=pure_black
# 是否启用动画效果（选项卡、窗口等）
fineui.enable-animation=false
# 是否使用自定义美化滚动条
fineui.custom-scrollbar=false
# 是否启用移动浏览器自适应
fineui.mobile-adaption=false

# 多语言资源（MessageSource）
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# 开发期关闭模板缓存，改模板即时生效
spring.thymeleaf.cache=false
